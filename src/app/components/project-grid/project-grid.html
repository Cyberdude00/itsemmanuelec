<div class="project-grid">

  <div class="project-list">
    @for (project of filteredProjects; track project.title + $index) {
      <app-project-card
        [project]="project"
        [class.is-expanded]="expandedProject === project"
        (requestOpen)="openProject(project)"
        (closed)="closeProject()">
      </app-project-card>
    }
  </div>

</div>
