<header class="main-header">
  <div class="capped">

    <div class="header-row">

          <li><a href="#biography">Biography</a></li>
        </ul>
      </div>

      <div class="site-title">
        <a href="/" aria-label="It's Emmanuelec">

        </a>
      </div>

      <div class="desktop-menu">

          <li><a href="#contact">Contact</a></li>
